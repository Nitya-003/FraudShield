version: "3.8"

services:
  fraudshield:
    build:
      context: .
      dockerfile: Dockerfile
    image: fraudshield:latest
    container_name: fraudshield_app
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - FRAUDSHIELD_RATE_LIMIT=120
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

