name: FraudShield Continuous Integration

on:
  push:
    branches: [main, ui-redesign]
  pull_request:
    branches: [main, ui-redesign]

jobs:
  python-test-suite:
    name: Backend Pytest & Consistency Audits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code repository
        uses: actions/checkout@v4

      - name: Free Disk Space (Ubuntu Runner)
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker system prune -af || true
          sudo rm -rf /var/lib/docker || true
          df -h

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt
          pip install --no-cache-dir pytest pytest-cov

      - name: Run Backend Pytest Suite
        run: |
          pytest tests/ -v --ignore=tests/test_playwright_e2e.py --ignore=tests/test_redesign_qa.py

      - name: Run Reproducibility Pipeline Sanity
        run: |
          python -m ml.pipeline --all

  frontend-build-suite:
    name: Frontend Lint, Typecheck & Vite Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend-web/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend-web
        run: npm ci

      - name: ESLint Code Quality Verification
        working-directory: frontend-web
        run: npm run lint

      - name: TypeScript Static Typecheck
        working-directory: frontend-web
        run: npx tsc --noEmit

      - name: Vite Production Build
        working-directory: frontend-web
        run: npm run build
